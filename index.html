<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de Posiciones Escolar</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 5px;
            color: var(--text-color);
            font-size: 2rem;
            text-align: center;
        }

        .table-container {
            width: 100%;
            max-width: 800px; /* Un poco más ancha para que quepan bien los datos escolares */
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow-x: auto; /* Por si se ve en celulares, activa scroll horizontal para que no se amontone */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 500px; /* Evita que las columnas se aplasten en pantallas chicas */
        }

        th, td {
            padding: 14px 16px;
        }

        th {
            background-color: #334155;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        tr {
            border-bottom: 1px solid #334155;
            transition: background-color 0.2s;
        }

        tr:last-child {
            border-bottom: none;
        }

        tr:hover {
            background-color: #293548;
        }

        .pos {
            font-weight: bold;
            width: 40px;
            text-align: center;
        }

        .pos-1 { color: #fbbf24; } /* Oro */
        .pos-2 { color: #94a3b8; } /* Plata */
        .pos-3 { color: #b45309; } /* Bronce */

        .pts {
            text-align: center;
            font-weight: bold;
            color: var(--accent-color);
            width: 60px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #4ade80;
            margin-bottom: 20px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
    </style>
</head>
<body>

    <h1>🏆 Tabla de Posiciones</h1>
    
    <div class="live-indicator">
        <div class="dot"></div> En vivo (Se actualiza automáticamente al haber cambios)
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="pos">Pos</th>
                    <th>Nombre</th>
                    <th>Especialidad</th>
                    <th>Grado y Grupo</th>
                    <th class="pts">Pts</th>
                </tr>
            </thead>
            <tbody>
                <!-- AQUÍ MODIFICAS TÚ LOS DATOS DIRECTAMENTE EN GITHUB -->
                <tr>
                    <td class="pos pos-1">1</td>
                    <td>Dominic Alex</td>
                    <td>CDI</td>
                    <td>4° A</td>
                    <td class="pts">350</td>
                </tr>
                <tr>
                    <td class="pos pos-2">2</td>
                    <td>Aury</td>
                    <td>CDI</td>
                    <td>4° A</td>
                    <td class="pts">250</td>
                </tr>
                <tr>
                    <td class="pos pos-3">3</td>
                    <td>Carlos</td>
                    <td>CDI</td>
                    <td>4° A</td>
                    <td class="pts">290</td>
                </tr>
                <tr>
                    <td class="pos">4</td>
                    <td>Lucia</td>
                    <td>CDI</td>
                    <td>4° C</td>
                    <td class="pts">35o</td>
                </tr>
                <!-- Puedes meter más filas copiando desde el <tr> hasta el </tr> -->
            </tbody>
        </table>
    </div>

    <!-- SCRIPT DE AUTO-ACTUALIZACIÓN 24/7 -->
    <script>
        // Cada 15 segundos revisa en segundo plano si cambió la tabla en el servidor
        setInterval(async () => {
            try {
                const respuesta = await fetch(window.location.href, { cache: 'no-store' });
                const textoNuevo = await respuesta.text();

                const parser = new DOMParser();
                const docNuevo = parser.parseFromString(textoNuevo, 'text/html');
                
                const tablaActual = document.querySelector('tbody').innerHTML;
                const tablaNueva = docNuevo.querySelector('tbody').innerHTML;

                // Si detecta que editaste las filas en tu archivo, se refresca sola
                if (tablaActual !== tablaNueva) {
                    console.log("Cambios en puntajes detectados. Actualizando tabla...");
                    window.location.reload();
                }
            } catch (error) {
                console.error("Error buscando actualizaciones:", error);
            }
        }, 15000); // Revisa cada 15 segundos para que sea aún más rápido
    </script>
</body>
</html>
